# Media layer. Runs NEXT TO the official Supabase stack (see SETUP.md).
services:
  minio:
    profiles: [local-storage]
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    volumes: [minio_data:/data]
    ports: ["9001:9001"]          # console; close this port after setup
    restart: unless-stopped

  minio-init:
    profiles: [local-storage]
    image: minio/mc:latest
    depends_on: [minio]
    entrypoint: >
      /bin/sh -c "
      sleep 5;
      mc alias set local http://minio:9000 ${S3_ACCESS_KEY} ${S3_SECRET_KEY};
      mc mb -p local/raw-uploads local/hls;
      mc anonymous set download local/hls;
      exit 0;"

  mediamtx:
    image: bluenviron/mediamtx:latest-ffmpeg
    volumes:
      - "./mediamtx.yml:/mediamtx.yml:ro"
      - live_data:/live
    ports:
      - "1935:1935"        # RTMP ingest (OBS) - the only public streaming port
    restart: unless-stopped

  uploader:
    build: ./uploader
    env_file: .env
    volumes:
      - live_data:/live:ro
    restart: unless-stopped

  worker:
    build: ./worker
    env_file: .env
    extra_hosts: ["host.docker.internal:host-gateway"]
    restart: unless-stopped

  caddy:
    image: caddy:2
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
    ports: ["80:80", "443:443"]
    restart: unless-stopped

volumes:
  live_data:
  minio_data:
  caddy_data:
