<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Media Backend Console</title>
<style>
:root{--bg:#f7f7f5;--card:#fff;--tx:#1b1b1b;--mut:#6b6b6b;--bd:#e2e2de;--ac:#1d6fe0;--ok:#1a8f4d;--bad:#c93a3a;--warn:#b7791f}
@media(prefers-color-scheme:dark){:root{--bg:#121212;--card:#1c1c1c;--tx:#eee;--mut:#9a9a9a;--bd:#333;--ac:#5aa0ff;--ok:#4cc27f;--bad:#ff7070;--warn:#e6b450}}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--tx);font:15px/1.45 system-ui,sans-serif}
header{display:flex;justify-content:space-between;align-items:center;padding:12px 16px;border-bottom:1px solid var(--bd);background:var(--card);position:sticky;top:0;z-index:5}
h1{font-size:17px;margin:0}nav{display:flex;gap:6px;overflow-x:auto;padding:10px 16px}
nav button{white-space:nowrap}main{padding:0 16px 40px;max-width:980px;margin:auto}
.card{background:var(--card);border:1px solid var(--bd);border-radius:10px;padding:14px;margin:12px 0}
input,select,textarea{width:100%;padding:9px;border:1px solid var(--bd);border-radius:8px;background:var(--bg);color:var(--tx);font:inherit;margin:4px 0 8px}
button{padding:8px 13px;border:1px solid var(--bd);border-radius:8px;background:var(--card);color:var(--tx);font:inherit;cursor:pointer}
button.p{background:var(--ac);border-color:var(--ac);color:#fff}button.d{color:var(--bad)}button.on{border-color:var(--ac);color:var(--ac)}
.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.stat b{display:block;font-size:26px}.mut{color:var(--mut);font-size:13px}
.row{display:flex;justify-content:space-between;gap:10px;align-items:center;padding:10px 0;border-top:1px solid var(--bd);flex-wrap:wrap}
.row:first-child{border-top:0}.acts{display:flex;gap:6px;flex-wrap:wrap}
.tag{font-size:12px;padding:2px 8px;border-radius:99px;border:1px solid var(--bd)}
.ready,.live{color:var(--ok)}.failed{color:var(--bad)}.processing,.uploaded{color:var(--warn)}
.scroll{overflow-x:auto}table{border-collapse:collapse;width:100%;font-size:13px}td,th{border-bottom:1px solid var(--bd);padding:6px;text-align:left;max-width:240px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
video{width:100%;border-radius:8px;background:#000;max-height:60vh}code{font-size:12px;word-break:break-all}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 16px;border-radius:8px;display:none;z-index:9}
</style></head><body>
<header><h1>Media Backend Console</h1><span id="who" class="mut"></span></header>
<nav id="nav" hidden></nav>
<main id="view"></main><div id="toast"></div>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.5.13/dist/hls.min.js"></script>
<script>
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
let sb,tab='overview',timer;
const store={get(k){try{return localStorage.getItem(k)||''}catch(e){return ''}},set(k,v){try{localStorage.setItem(k,v)}catch(e){}}};
const cfg=()=>({url:store.get('url'),key:store.get('key'),cdn:store.get('cdn'),rtmp:store.get('rtmp')});
function toast(m){const t=$('#toast');t.textContent=m;t.style.display='block';setTimeout(()=>t.style.display='none',3500)}
function setView(h){$('#view').innerHTML=h}
function play(url){
  const box=$('#player');box.innerHTML='<video controls autoplay playsinline></video><div class="mut"><code>'+esc(url)+'</code></div>';
  const v=box.querySelector('video');
  if(v.canPlayType('application/vnd.apple.mpegurl'))v.src=url;
  else if(window.Hls&&Hls.isSupported()){const h=new Hls();h.loadSource(url);h.attachMedia(v)}
  box.scrollIntoView({behavior:'smooth'});
}
async function boot(){
  clearInterval(timer);const c=cfg();
  if(!c.url||!c.key)return connectView();
  sb=supabase.createClient(c.url,c.key);
  const {data:{session}}=await sb.auth.getSession();
  if(!session)return authView();
  $('#who').textContent=session.user.email;$('#nav').hidden=false;go(tab);
}
function connectView(){
  $('#nav').hidden=true;const c=cfg();
  setView(`<div class="card"><h3>Connect your backend</h3>
  <label>Supabase API URL</label><input id="u" placeholder="https://api.example.com" value="${esc(c.url)}">
  <label>Anon key (never paste the service_role key here)</label><input id="k" value="${esc(c.key)}">
  <label>CDN base URL (R2 custom domain)</label><input id="c" placeholder="https://cdn.example.com" value="${esc(c.cdn)}">
  <label>Server address for OBS (RTMP)</label><input id="r" placeholder="rtmp://YOUR_SERVER_IP/" value="${esc(c.rtmp)}">
  <button class="p" onclick="saveCfg()">Save and continue</button></div>`);
}
function saveCfg(){store.set('url',$('#u').value.trim().replace(/\/$/,''));store.set('key',$('#k').value.trim());store.set('cdn',$('#c').value.trim().replace(/\/$/,''));store.set('rtmp',$('#r').value.trim());boot()}
function authView(){
  $('#nav').hidden=true;$('#who').textContent='';
  setView(`<div class="card"><h3>Sign in</h3><input id="e" type="email" placeholder="Email"><input id="p" type="password" placeholder="Password">
  <button class="p" onclick="auth('in')">Sign in</button> <button onclick="auth('up')">Create account</button> <button onclick="connectView()">Settings</button></div>`);
}
async function auth(m){
  const cr={email:$('#e').value,password:$('#p').value};
  const {error}=m==='in'?await sb.auth.signInWithPassword(cr):await sb.auth.signUp(cr);
  if(error)return toast(error.message);toast(m==='up'?'Account created. Sign in (confirm email if required).':'Signed in');boot();
}
async function out(){await sb.auth.signOut();boot()}
const TABS=['overview','videos','live','data','settings'];
function go(t){
  tab=t;clearInterval(timer);
  $('#nav').innerHTML=TABS.map(x=>`<button class="${x===t?'on':''}" onclick="go('${x}')">${x[0].toUpperCase()+x.slice(1)}</button>`).join('')+'<button onclick="out()">Sign out</button>';
  ({overview,videos,live,data,settings})[t]();
}
async function count(table,f){let q=sb.from(table).select('*',{count:'exact',head:true});if(f)q=f(q);const {count}=await q;return count??0}
async function overview(){
  setView('<p class="mut">Loading…</p>');
  const [v,r,p,f,l]=await Promise.all([count('videos'),count('videos',q=>q.eq('status','ready')),count('videos',q=>q.in('status',['uploaded','processing'])),count('videos',q=>q.eq('status','failed')),count('live_streams',q=>q.eq('is_live',true))]);
  setView(`<div class="grid">${[['Videos',v],['Ready',r],['Queued',p],['Failed',f],['Live now',l]].map(([a,b])=>`<div class="card stat"><b>${b}</b><span class="mut">${a}</span></div>`).join('')}</div>
  <div class="card"><h3>Quick start</h3><p class="mut">Videos: upload a file, the worker turns it into HLS, status becomes Ready. Live: create a stream, copy the OBS settings, press Go live in OBS. Data: browse or edit any table.</p></div>`);
}
async function videos(){
  setView(`<div class="card"><h3>Upload video</h3><input id="t" placeholder="Title"><input id="f" type="file" accept="video/*"><button class="p" id="ub" onclick="upload()">Upload</button><p class="mut">Large files: raise FILE_SIZE_LIMIT in your Supabase .env.</p></div>
  <div id="player"></div><div class="card" id="list">Loading…</div>`);
  const draw=async()=>{
    const {data,error}=await sb.from('videos').select('*').order('created_at',{ascending:false}).limit(100);
    if(error)return $('#list').textContent=error.message;
    $('#list').innerHTML=data.length?data.map(v=>`<div class="row"><div><b>${esc(v.title)}</b> <span class="tag ${v.status}">${v.status}</span><div class="mut">${new Date(v.created_at).toLocaleString()} · ${v.views} views${v.error?' · '+esc(v.error):''}</div></div>
    <div class="acts">${v.status==='ready'?`<button onclick="play('${esc(cfg().cdn)}/${esc(v.hls_path)}')">Play</button>`:''}${v.status==='failed'?`<button onclick="retry('${v.id}')">Retry</button>`:''}<button class="d" onclick="del('videos','${v.id}',videos)">Delete</button></div></div>`).join(''):'<p class="mut">No videos yet.</p>';
  };
  draw();timer=setInterval(draw,5000);
}
async function upload(){
  const f=$('#f').files[0];if(!f)return toast('Choose a file');
  const {data:{user}}=await sb.auth.getUser();const b=$('#ub');b.disabled=true;b.textContent='Uploading…';
  const path=`${user.id}/${Date.now()}-${f.name.replace(/[^\w.-]/g,'_')}`;
  const up=await sb.storage.from('raw-uploads').upload(path,f);
  if(up.error){b.disabled=false;b.textContent='Upload';return toast(up.error.message)}
  const {error}=await sb.from('videos').insert({title:$('#t').value||f.name,raw_path:path});
  if(error)toast(error.message);else toast('Uploaded. Processing starts shortly.');videos();
}
async function retry(id){await sb.from('videos').update({status:'uploaded',error:null}).eq('id',id);toast('Re-queued')}
async function del(t,id,cb){if(!confirm('Delete this row?'))return;const {error}=await sb.from(t).delete().eq('id',id);if(error)toast(error.message);cb()}
async function live(){
  setView(`<div class="card"><h3>New live stream</h3><input id="t" placeholder="Stream title"><button class="p" onclick="newLive()">Create</button></div><div id="player"></div><div class="card" id="list">Loading…</div>`);
  const {data,error}=await sb.from('live_streams').select('*').order('created_at',{ascending:false});
  if(error)return $('#list').textContent=error.message;
  const c=cfg();
  $('#list').innerHTML=data.length?data.map(s=>`<div class="row" style="align-items:flex-start"><div><b>${esc(s.title)}</b> <span class="tag ${s.is_live?'live':''}">${s.is_live?'live':'offline'}</span>
  <div class="mut">OBS Server: <code>${esc(c.rtmp||'rtmp://YOUR_SERVER_IP/')}</code><br>Stream key: <code>${esc(s.stream_key)}?user=publisher&amp;pass=YOUR_STREAM_PASSWORD</code><br>Viewer URL: <code>${esc(c.cdn)}/live/${esc(s.stream_key)}/index.m3u8</code></div></div>
  <div class="acts"><button onclick="play('${esc(c.cdn)}/live/${esc(s.stream_key)}/index.m3u8')">Watch</button><button onclick="toggleLive('${s.id}',${!s.is_live})">${s.is_live?'Mark offline':'Mark live'}</button><button class="d" onclick="del('live_streams','${s.id}',live)">Delete</button></div></div>`).join(''):'<p class="mut">No streams yet.</p>';
}
async function newLive(){const t=$('#t').value;if(!t)return toast('Add a title');const {error}=await sb.from('live_streams').insert({title:t});if(error)toast(error.message);live()}
async function toggleLive(id,v){await sb.from('live_streams').update({is_live:v}).eq('id',id);live()}
async function data(){
  setView(`<div class="card"><h3>Table browser</h3><div style="display:flex;gap:6px"><input id="tn" value="videos" list="tl"><datalist id="tl"><option>videos<option>live_streams</datalist><button class="p" onclick="load()">Load</button></div>
  <div class="scroll" id="tbl"></div></div>
  <div class="card"><h3>Insert row (JSON)</h3><textarea id="js" rows="4" placeholder='{"title":"Example"}'></textarea><button onclick="ins()">Insert into table</button></div>`);
  load();
}
async function load(){
  const t=$('#tn').value.trim();const {data,error}=await sb.from(t).select('*').limit(50);
  if(error)return $('#tbl').innerHTML='<p class="mut">'+esc(error.message)+'</p>';
  if(!data.length)return $('#tbl').innerHTML='<p class="mut">No rows.</p>';
  const cols=Object.keys(data[0]);
  $('#tbl').innerHTML='<table><tr>'+cols.map(c=>'<th>'+esc(c)+'</th>').join('')+'<th></th></tr>'+data.map(r=>'<tr>'+cols.map(c=>'<td title="'+esc(JSON.stringify(r[c]))+'">'+esc(typeof r[c]==='object'?JSON.stringify(r[c]):r[c])+'</td>').join('')+(r.id?`<td><button class="d" onclick="del('${esc(t)}','${r.id}',load)">Delete</button></td>`:'<td></td>')+'</tr>').join('')+'</table>';
}
async function ins(){
  let row;try{row=JSON.parse($('#js').value)}catch(e){return toast('Invalid JSON')}
  const {error}=await sb.from($('#tn').value.trim()).insert(row);if(error)toast(error.message);else{toast('Inserted');load()}
}
function settings(){
  const c=cfg();
  setView(`<div class="card"><h3>Connection</h3><p class="mut">API: ${esc(c.url)}<br>CDN: ${esc(c.cdn)}<br>RTMP: ${esc(c.rtmp)}</p><button onclick="connectView()">Edit connection</button></div>
  <div class="card"><h3>Reminders</h3><p class="mut">This page only uses your anon key. Row-level security in schema.sql decides who can read and write. Keep your service_role key and stream password out of the browser.</p></div>`);
}
boot();
</script></body></html>
